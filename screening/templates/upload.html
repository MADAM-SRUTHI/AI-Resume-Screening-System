<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screening System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Resume Screening System</h1>

    <p class="subtitle">
        Upload your resume for screening
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Upload Resume</label>
        <input type="file" name="resume_file" accept=".pdf,.docx" required>

        <button type="submit">
            Upload Resume
        </button>

    </form>

</div>

</body>
</html>
